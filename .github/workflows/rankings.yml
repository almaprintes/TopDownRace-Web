name: Rankings checks and refresh
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/rankings.*', 'assets/cars/**', 'package*.json', 'scripts/**', 'tests/**', 'ops/**', '.github/workflows/rankings.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: rankings-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --check assets/rankings.js
      - run: node --test tests/*.test.mjs
  browser:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 8765 &
          node tests/rankings-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-mobile-previews
          path: test-results/
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rankings-data
          path: ranking-cache
      - name: Download one shared snapshot
        id: sync
        continue-on-error: true
        run: node scripts/sync-rankings.mjs ranking-cache
      - name: Publish snapshot and usage counters
        working-directory: ranking-cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.json usage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public rankings and usage counters"
            git push origin HEAD:rankings-data
          fi
      - name: Report refresh failure
        if: steps.sync.outcome == 'failure'
        run: exit 1
